name: Automação da Previsão Meteorológica

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 UTC (03:00 Brasília)
    - cron: '0 6 * * *'
  # Permite disparar o script manualmente na aba "Actions"
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4.2.2

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib cartopy requests numpy pandas

    - name: Executar script de geração do mapa
      run: python gerar_mapa.py

    - name: Fazer commit e push do mapa atualizado no repositório
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add previsao_brasil.png
        git commit -m "bot: Atualização diária da previsão [skip ci]" || exit 0
        git push
        git commit -m "bot: Atualização diária da previsão [skip ci]" || exit 0
        git push
